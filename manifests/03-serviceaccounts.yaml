# =============================================================================
# File       : manifests/03-serviceaccounts.yaml
# Unit II    : 2.3.3 Service Accounts
# Apply with : kubectl apply -f manifests/03-serviceaccounts.yaml
#
# One ServiceAccount per tier instead of the namespace's 'default' account
# (lecture 2.3.6). None of the three application tiers ever calls the
# Kubernetes API, so:
#   - no Role is bound to them (they can do nothing), and
#   - automountServiceAccountToken: false means no API token is even mounted
#     into their Pods. A compromised container has no credential to steal.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-sa
  namespace: dso202-assignment-02
  labels: { app.kubernetes.io/part-of: task-tracker, tier: database }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: dso202-assignment-02
  labels: { app.kubernetes.io/part-of: task-tracker, tier: backend }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: dso202-assignment-02
  labels: { app.kubernetes.io/part-of: task-tracker, tier: frontend }
automountServiceAccountToken: false
